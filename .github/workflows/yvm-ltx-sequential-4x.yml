name: YVM LTX Sequential 4x Capacity Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-ltx-sequential-4x.yml"

permissions:
  contents: read

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3" requests
      - name: Generate four clips sequentially on one runner
        run: |
          mkdir -p out
          for CYCLE in 1 2 3 4; do
            SEED=$((3000 + CYCLE))
            echo "=== CYCLE $CYCLE ==="
            python yvm-cloud/ltx_zerogpu.py               --prompt "1990s Wall Street trading floor, documentary realism, natural human traders, CRT monitors, cinematic camera motion, vertical composition, authentic office lighting, no text, no logo, variation $CYCLE"               --output "out/seq_${CYCLE}.mp4"               --duration 5               --seed "$SEED" --attempts 2
            python yvm-cloud/qc_video.py "out/seq_${CYCLE}.mp4" --min-duration 4 --min-width 700 --min-height 1200
          done
      - name: Capacity gate
        run: |
          test "$(find out -name 'seq_*.mp4' | wc -l)" -eq 4
          echo "LTX_SINGLE_RUNNER_4X=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: ltx-sequential-4x
          path: out/seq_*.mp4
          retention-days: 1

# retry-validation-v2
