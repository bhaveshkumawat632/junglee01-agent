name: YVM Cancel Stale Kaggle Poll

on:
  push:
    paths:
      - ".github/workflows/yvm-cancel-stale-kaggle.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale quality run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             repos/${GITHUB_REPOSITORY}/actions/runs/37328839096/cancel
          echo "STALE_KAGGLE_RUN_CANCEL_REQUESTED=37328839096"
