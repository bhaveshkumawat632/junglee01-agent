name: YVM Wan ZeroGPU Efficiency Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-wan-efficiency-test.yml"

permissions:
  contents: read

jobs:
  efficiency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Generate low-budget vertical Wan clip
        run: |
          mkdir -p out
          python yvm-cloud/wan_zerogpu.py             --prompt "cinematic technology documentary scene, adult analyst at glowing computer monitors, natural realistic motion, vertical framing, no readable text, no logo"             --output out/wan_efficiency.mp4             --frames 29             --steps 6             --seed 632
      - name: QC
        run: python yvm-cloud/qc_video.py out/wan_efficiency.mp4 --min-duration 1.5 --min-width 400 --min-height 700
      - uses: actions/upload-artifact@v4
        with:
          name: wan-efficiency-test
          path: out/wan_efficiency.mp4
          retention-days: 1
