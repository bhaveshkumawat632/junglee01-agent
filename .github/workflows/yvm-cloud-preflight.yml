name: YVM Cloud Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "yvm-cloud/**"
      - ".github/workflows/yvm-cloud-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check policy
        run: |
          python - <<'PY'
          import json
          p=json.load(open("yvm-cloud/provider-policy.json"))
          c=json.load(open("yvm-cloud/config.json"))
          assert p["no_billing_details"] is True
          assert p["paid_fallback_allowed"] is False
          assert p["required_capacity_multiple"] == 4
          assert c["capacity_policy"]["billing_details_allowed"] is False
          assert c["capacity_policy"]["paid_fallback"] is False
          assert c["capacity_policy"]["required_multiple"] == 4
          print("NO_CARD_POLICY=PASS")
          print("CAPACITY_POLICY=4X")
          PY

      - name: Provider readiness
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          GEMINI_WEB_COOKIE: ${{ secrets.GEMINI_WEB_COOKIE }}
          FLOW_CDP_URL: ${{ secrets.FLOW_CDP_URL }}
        run: |
          python yvm-cloud/orchestrator.py || true

      - name: YouTube OAuth readiness
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          names=["YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN"]
          missing=[x for x in names if not os.getenv(x)]
          if missing:
              print("YOUTUBE_AUTH=WAITING")
              print("MISSING="+",".join(missing))
          else:
              print("YOUTUBE_AUTH=SECRETS_PRESENT")
          PY

      - name: Summary
        run: |
          echo "Preflight complete."
          echo "Card-free baseline remains usable without optional provider credentials."
          echo "Production publishing stays disabled until YouTube OAuth is green."
