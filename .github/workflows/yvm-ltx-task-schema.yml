name: YVM LTX ZeroGPU Task Schema

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-ltx-task-schema.yml"

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Fetch public LTX task schema
        run: |
          python - <<'PY'
          from gradio_client import Client
          c=Client("RioShiina/LTX-2.5", verbose=False)
          print(c.predict(api_name="/get_task_list"))
          PY
