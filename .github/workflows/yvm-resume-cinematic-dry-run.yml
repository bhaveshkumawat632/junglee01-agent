name: YVM Resume Cinematic Dry Run

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-resume-cinematic-dry-run.yml"
      - "yvm-cloud/run_daily.py"
      - "yvm-cloud/qc_motion.py"
      - "yvm-cloud/kaggle_batch_generate.py"
      - "yvm-cloud/render_bilingual.py"
      - "yvm-cloud/qc_pair.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: yvm-finalize-existing-batch
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Install production dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -r yvm-cloud/requirements.txt

      - name: Recover exact plan from failed full run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/yvm-prev
          mkdir -p /tmp/yvm-prev out/daily
          gh run download 37351317680             --repo "$GITHUB_REPOSITORY"             --name yvm-full-cinematic-dry-run             --dir /tmp/yvm-prev
          PLAN="$(find /tmp/yvm-prev -type f -name plan.json | head -n 1)"
          test -n "$PLAN"
          cp "$PLAN" out/daily/plan.json
          echo "RECOVERED_PLAN=$PLAN"

      - name: Reuse 12 completed Kaggle clips and finish bilingual package
        run: |
          python yvm-cloud/run_daily.py             --workdir out/daily             --scenes 12             --clip-duration 5             --final-duration 60             --free-video-bonus 2             --min-ai-motion-scenes 12             --reuse-plan             --reuse-kaggle-batch

      - name: Final package verification
        run: |
          python yvm-cloud/qc_video.py out/daily/render/final_en.mp4             --min-duration 59.5 --min-width 1000 --min-height 1800             --require-audio --video-codec h264 --audio-codec aac
          python yvm-cloud/qc_video.py out/daily/render/final_hi.mp4             --min-duration 59.5 --min-width 1000 --min-height 1800             --require-audio --video-codec h264 --audio-codec aac
          python yvm-cloud/qc_motion.py out/daily/visual_master.mp4
          python yvm-cloud/qc_pair.py             --en-video out/daily/render/final_en.mp4             --hi-video out/daily/render/final_hi.mp4             --en-subtitles out/daily/render/subtitles_en.srt             --hi-subtitles out/daily/render/subtitles_hi.srt             --min-cues 3
          python - <<'PY'
          import json
          r=json.load(open("out/daily/result.json"))
          assert r["status"] == "READY_FOR_UPLOAD", r
          assert r["ai_video_upgrades"] == 12, r
          assert "kaggle_t4x2_ltx_batch" in r.get("motion_providers",[]), r
          assert r["payment_card_used"] is False
          print("FULL_CINEMATIC_RESUME=PASS")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yvm-final-cinematic-package
          path: |
            out/daily/plan.json
            out/daily/result.json
            out/daily/visual_master.mp4
            out/daily/clips/kaggle_batch_result.json
            out/daily/clips/scene_*.mp4
            out/daily/render/final_en.mp4
            out/daily/render/final_hi.mp4
            out/daily/render/subtitles_en.srt
            out/daily/render/subtitles_hi.srt
          retention-days: 2
