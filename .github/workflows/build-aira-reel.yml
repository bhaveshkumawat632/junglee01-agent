name: Build Aira Reel 02

on:
  push:
    paths:
      - ".github/workflows/build-aira-reel.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download Aira master image
        run: |
          mkdir -p media
          curl -L --fail --retry 3             "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/742b93f5a84251f3e7772f180b7e23c6fa6fc9730f181889547c4252f703beaf.png"             -o /tmp/aira.png

      - name: Build premium vertical Instagram Reel
        run: |
          ffmpeg -y -loop 1 -framerate 30 -t 8 -i /tmp/aira.png             -f lavfi -i "sine=frequency=62:sample_rate=48000:duration=8"             -f lavfi -i "sine=frequency=220:sample_rate=48000:duration=8"             -filter_complex "[0:v]split=2[bg][fg];[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=28:12,eq=brightness=-0.09:saturation=1.08[bg2];[fg]scale=1020:-1,eq=contrast=1.04:saturation=1.08:brightness=0.008,unsharp=5:5:0.30:5:5:0[fg2];[bg2][fg2]overlay=x='(W-w)/2+9*sin(2*PI*t/4.2)':y='(H-h)/2-55+8*sin(2*PI*t/5.0)':eval=frame,noise=alls=1.2:allf=t+u,fade=t=in:st=0:d=0.20,fade=t=out:st=7.55:d=0.45,format=yuv420p[v];[1:a]volume=0.055[a1];[2:a]volume=0.018[a2];[a1][a2]amix=inputs=2:normalize=0,afade=t=in:st=0:d=0.25,afade=t=out:st=7.45:d=0.5[a]"             -map "[v]" -map "[a]" -t 8             -c:v libx264 -preset medium -crf 19 -profile:v high -r 30 -movflags +faststart             -c:a aac -b:a 128k -ar 48000 -ac 2             media/aira_vesha_reel_02.mp4

      - name: QC
        run: |
          ffprobe -v error             -show_entries stream=codec_name,width,height:format=duration,size             -of default=noprint_wrappers=1             media/aira_vesha_reel_02.mp4

      - name: Commit generated Reel
        run: |
          git config user.name "Junglee01 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add media/aira_vesha_reel_02.mp4
          git commit -m "feat: add Aira Vesha Reel 02" || exit 0
          git push
