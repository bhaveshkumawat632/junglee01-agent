name: YVM More ZeroGPU Video Spaces

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-hf-more-spaces.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        space:
          - DeepRat/LTX-Video-ZeroGPU-Optimized
          - multimodalart/dreamverse-ltx2-zerogpu
          - kulkas2pintu/Wan2.2-14B-Preview
          - 00000tt/LTX-2.3-10Eros-Image-to-Video
    steps:
      - run: python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Inspect API
        env:
          HF_SPACE: ${{ matrix.space }}
        run: |
          python - <<'PY'
          import os
          from gradio_client import Client
          s=os.environ["HF_SPACE"]
          print("SPACE=",s)
          c=Client(s,verbose=False)
          c.view_api(all_endpoints=True,print_info=True)
          PY
