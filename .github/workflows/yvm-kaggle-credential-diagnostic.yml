name: YVM Kaggle Credential Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-kaggle-credential-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      KAGGLE_API_TOKEN_SECRET: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USERNAME_SECRET: ${{ secrets.KAGGLE_USERNAME }}
    steps:
      - name: Confirm repository context
        run: |
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "REF=$GITHUB_REF_NAME"

      - name: Check repository secret presence
        run: |
          if [ -n "$KAGGLE_API_TOKEN_SECRET" ]; then
            echo "KAGGLE_API_TOKEN_SECRET_PRESENT=true"
          else
            echo "KAGGLE_API_TOKEN_SECRET_PRESENT=false"
          fi
          if [ -n "$KAGGLE_USERNAME_SECRET" ]; then
            echo "KAGGLE_USERNAME_SECRET_PRESENT=true"
          else
            echo "KAGGLE_USERNAME_SECRET_PRESENT=false"
          fi

      - name: Check same names under Actions Variables
        run: |
          echo "KAGGLE_API_TOKEN_VARIABLE_PRESENT=${{ vars.KAGGLE_API_TOKEN != '' }}"
          echo "KAGGLE_USERNAME_VARIABLE_PRESENT=${{ vars.KAGGLE_USERNAME != '' }}"

      - name: Diagnostic result
        run: |
          if [ -n "$KAGGLE_API_TOKEN_SECRET" ] && [ -n "$KAGGLE_USERNAME_SECRET" ]; then
            echo "KAGGLE_SECRET_PAIR=READY"
          else
            echo "KAGGLE_SECRET_PAIR=MISSING"
          fi
