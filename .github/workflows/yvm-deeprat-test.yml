name: YVM DeepRat ZeroGPU Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-deeprat-test.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - run: |
          mkdir -p out
          python yvm-cloud/deeprat_ltx.py             --prompt "cinematic 1990s trading floor, natural people, CRT monitors, realistic documentary camera motion, vertical framing, no text"             --output out/deeprat_test.mp4             --duration 3             --seed 632
      - run: python yvm-cloud/qc_video.py out/deeprat_test.mp4 --min-duration 2 --min-width 400 --min-height 700
      - uses: actions/upload-artifact@v4
        with:
          name: deeprat-zero-card-test
          path: out/deeprat_test.mp4
          retention-days: 1
