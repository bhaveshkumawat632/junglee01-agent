name: YVM HF ZeroGPU Generate Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-hf-generate-test.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Generate one anonymous ZeroGPU test clip
        run: |
          mkdir -p out
          python - <<'PY'
          from gradio_client import Client
          import os, shutil
          c=Client("zai-org/CogVideoX-5B-Space", verbose=False)
          result=c.predict(
              "Cinematic close shot of a vintage Wall Street trading desk in the 1990s, CRT monitors glowing, ticker tape, realistic camera movement, no text overlays",
              None,
              None,
              0.8,
              12345,
              False,
              False,
              api_name="/generate",
          )
          print("RESULT", result)
          candidates=[]
          def walk(x):
              if isinstance(x,str):
                  candidates.append(x)
              elif isinstance(x,dict):
                  for v in x.values(): walk(v)
              elif isinstance(x,(list,tuple)):
                  for v in x: walk(v)
          walk(result)
          for p in candidates:
              if p and os.path.exists(p) and p.lower().endswith((".mp4",".webm",".mov")):
                  shutil.copy2(p,"out/hf_cogvideox_test.mp4")
                  print("COPIED",p)
                  break
          if not os.path.exists("out/hf_cogvideox_test.mp4"):
              raise SystemExit("No local video file returned")
          PY
      - name: QC
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height -show_entries format=duration,size -of default=noprint_wrappers=1 out/hf_cogvideox_test.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: hf-cogvideox-zero-card-test
          path: out/hf_cogvideox_test.mp4
          retention-days: 1
