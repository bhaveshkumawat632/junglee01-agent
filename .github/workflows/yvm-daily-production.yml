name: YVM Daily Production

# Safe schedule is installed now, but the scheduled job is skipped until
# YVM_PRODUCTION_ENABLED=true after YouTube OAuth is connected.
# 15:37 UTC = 21:07 IST.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-daily-production.yml"
  schedule:
    - cron: "37 15 * * *"

permissions:
  contents: read

concurrency:
  group: yvm-daily-production
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.YVM_PRODUCTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check -r yvm-cloud/requirements.txt

      - name: Produce English and Hindi Shorts
        run: |
          python yvm-cloud/run_daily.py             --workdir out/daily             --scenes 12             --clip-duration 5             --final-duration 60             --free-video-bonus 2

      - name: Verify final pair before publishing
        run: |
          python yvm-cloud/qc_video.py out/daily/render/final_en.mp4 --min-duration 59.5 --min-width 1000 --min-height 1800 --require-audio
          python yvm-cloud/qc_video.py out/daily/render/final_hi.mp4 --min-duration 59.5 --min-width 1000 --min-height 1800 --require-audio

      - name: Upload production package artifact
        uses: actions/upload-artifact@v4
        with:
          name: yvm-daily-package-${{ github.run_id }}
          path: |
            out/daily/result.json
            out/daily/plan.json
            out/daily/assets/attribution.json
            out/daily/render/final_en.mp4
            out/daily/render/final_hi.mp4
            out/daily/render/subtitles_en.srt
            out/daily/render/subtitles_hi.srt
          retention-days: 2

      - name: Require YouTube OAuth before public upload
        if: ${{ vars.YVM_PRODUCTION_ENABLED == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python yvm-cloud/youtube_preflight.py

      - name: Upload both videos to YouTube
        if: ${{ vars.YVM_PRODUCTION_ENABLED == 'true' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python yvm-cloud/upload_pair.py             --result out/daily/result.json             --privacy public
