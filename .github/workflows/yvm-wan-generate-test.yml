name: YVM Wan ZeroGPU Generate Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-wan-generate-test.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Generate one vertical Wan clip
        run: |
          mkdir -p out
          python yvm-cloud/wan_zerogpu.py             --prompt "1990s Wall Street trading floor, documentary realism, natural adult traders at CRT monitors, cinematic handheld camera push-in, authentic office lighting, no readable text, no logo"             --output out/wan_test.mp4             --frames 49             --steps 8             --seed 1986
      - name: QC
        run: python yvm-cloud/qc_video.py out/wan_test.mp4 --min-duration 2 --min-width 400 --min-height 700
      - uses: actions/upload-artifact@v4
        with:
          name: wan-keyless-video-test
          path: out/wan_test.mp4
          retention-days: 1
