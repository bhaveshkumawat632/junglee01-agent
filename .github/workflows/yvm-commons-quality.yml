name: YVM Commons Visual Relevance Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-commons-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python -m pip install --disable-pip-version-check requests
      - name: Create deterministic Wall Street visual plan
        run: |
          mkdir -p out/commons
          cat > out/commons/plan.json <<'JSON'
          {
            "topic": "1990s Wall Street trading floor",
            "scene_prompts": [
              "1990s Wall Street stock exchange trading floor",
              "trader at CRT computer monitor finance office",
              "stock market trader telephone desk",
              "New York Stock Exchange trading floor",
              "financial market computer terminals 1990s",
              "Wall Street office traders",
              "stock exchange exterior New York",
              "financial newspaper market desk",
              "computer workstation 1990s office",
              "business district Manhattan Wall Street",
              "stock exchange traders historical",
              "finance office telephone computer historical"
            ]
          }
          JSON
      - name: Download licensed bitmap candidates
        run: |
          python yvm-cloud/commons_assets.py             --plan out/commons/plan.json             --out-dir out/commons/assets             --count 12             --unique-searches 6
      - name: Fill missing scenes with prompt-aware procedural visuals
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python yvm-cloud/procedural_assets.py             --plan out/commons/plan.json             --out-dir out/commons/assets             --count 12

      - name: Combined visual quality gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=json.load(open("out/commons/assets/attribution.json"))
          bad=[]
          licensed=0
          for x in rows:
              if x.get("status")=="ok":
                  licensed+=1
                  t=x.get("title","").lower()
                  if t.endswith((".pdf",".djvu",".tif",".tiff",".xcf",".psd")):
                      bad.append(t)
          missing=[]
          for i in range(1,13):
              matches=[]
              for ext in (".jpg",".jpeg",".png",".webp"):
                  p=Path("out/commons/assets")/f"scene_{i:02d}{ext}"
                  if p.exists() and p.stat().st_size>10000:
                      matches.append(p)
              if not matches:
                  missing.append(i)
          proc=json.load(open("out/commons/assets/procedural_manifest.json"))
          print("LICENSED_BITMAP_ASSETS=",licensed)
          print("PROCEDURAL_ASSETS=",len(proc))
          print("BAD_DOCUMENT_ASSETS=",bad)
          print("MISSING_SCENES=",missing)
          assert not bad
          assert not missing
          assert licensed >= 2
          assert licensed + len(proc) >= 12
          print("COMBINED_VISUAL_QUALITY_GATE=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commons-visual-quality
          path: |
            out/commons/assets/attribution.json
            out/commons/assets/procedural_manifest.json
          retention-days: 1

# combined-v2
