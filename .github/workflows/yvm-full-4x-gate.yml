name: YVM Full Daily 4x No-Card Gate

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-full-4x-gate.yml"

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        cycle: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check -r yvm-cloud/requirements.txt

      - name: Run full daily cycle
        run: |
          case "${{ matrix.cycle }}" in
            1) TOPIC="AI chips and data centers" ;;
            2) TOPIC="How cloud computing businesses make money" ;;
            3) TOPIC="How Wall Street information systems changed trading" ;;
            4) TOPIC="Why digital payments matter to modern business" ;;
          esac
          python yvm-cloud/run_daily.py             --workdir "out/cycle-${{ matrix.cycle }}"             --topic "$TOPIC"             --scenes 12             --clip-duration 5             --final-duration 60             --free-video-bonus 0

      - name: Verify complete English and Hindi package
        run: |
          D="out/cycle-${{ matrix.cycle }}"
          python yvm-cloud/qc_video.py "$D/render/final_en.mp4" --min-duration 59.5 --min-width 1000 --min-height 1800 --require-audio
          python yvm-cloud/qc_video.py "$D/render/final_hi.mp4" --min-duration 59.5 --min-width 1000 --min-height 1800 --require-audio
          python - <<'PY'
          import json, os
          d=json.load(open("out/cycle-${{ matrix.cycle }}/result.json"))
          assert d["status"]=="READY_FOR_UPLOAD"
          assert d["payment_card_used"] is False
          assert d["scene_count"]==12
          print("FULL_CYCLE_PASS", "${{ matrix.cycle }}", d["planner"], d["topic"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: yvm-full-cycle-${{ matrix.cycle }}
          path: |
            out/cycle-${{ matrix.cycle }}/result.json
            out/cycle-${{ matrix.cycle }}/plan.json
            out/cycle-${{ matrix.cycle }}/render/final_en.mp4
            out/cycle-${{ matrix.cycle }}/render/final_hi.mp4
          retention-days: 1

  gate:
    needs: cycle
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "FULL_DAILY_CYCLES=4"
          echo "FINAL_VIDEOS=8"
          echo "NO_CARD=YES"
          echo "YVM_FULL_4X_GATE=PASS"

# robustness-v2
