name: YVM HF ZeroGPU Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-hf-preflight.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        space:
          - zai-org/CogVideoX-5B-Space
          - RioShiina/LTX-2.5
          - techfreakworm/LTX2.3-Studio
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Discover public Space API
        env:
          HF_SPACE: ${{ matrix.space }}
        run: |
          python - <<'PY'
          import os
          from gradio_client import Client
          space=os.environ["HF_SPACE"]
          print("SPACE=", space)
          c=Client(space, verbose=False)
          c.view_api(all_endpoints=True, print_info=True)
          print("ENDPOINTS", sorted(getattr(c, "endpoints", {}).keys()))
          PY
