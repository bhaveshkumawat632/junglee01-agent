name: YVM Wan2.2 I2V Generate Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-wan22-i2v-test.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check "gradio_client>=1.3" "Pillow>=10"
      - name: Build deterministic vertical reference frame
        run: |
          mkdir -p out
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          w,h=480,832
          im=Image.new("RGB",(w,h),(18,24,34))
          d=ImageDraw.Draw(im)
          for y in range(h):
              t=y/(h-1)
              d.line((0,y,w,y),fill=(int(18+28*t),int(24+20*t),int(34+12*t)))
          for x in range(35,450,58):
              d.rectangle((x,180,x+38,520),fill=(40,55,70),outline=(85,115,130))
              d.rectangle((x+4,190,x+34,260),fill=(35,105,125))
              d.rectangle((x+4,275,x+34,345),fill=(95,70,35))
          d.rectangle((35,570,445,690),fill=(46,38,30))
          d.ellipse((165,500,315,650),fill=(70,62,55))
          im=im.filter(ImageFilter.GaussianBlur(0.4))
          im.save("out/reference.png")
          PY
      - name: Animate with Wan2.2 ZeroGPU
        run: |
          python yvm-cloud/wan22_i2v.py             --image out/reference.png             --prompt "cinematic 1990s financial trading room comes alive, subtle handheld camera push, glowing CRT displays flicker softly, realistic office atmosphere, smooth natural motion, no readable text, no logo"             --output out/wan22_i2v.mp4             --duration 2             --steps 4             --seed 1986
      - name: QC
        run: python yvm-cloud/qc_video.py out/wan22_i2v.mp4 --min-duration 1 --min-width 300 --min-height 500
      - uses: actions/upload-artifact@v4
        with:
          name: wan22-i2v-keyless-test
          path: out/wan22_i2v.mp4
          retention-days: 1
