name: YVM Wan ZeroGPU Probe

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/yvm-wan-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check "gradio_client>=1.3"
      - name: Health and models
        run: |
          python - <<'PY'
          from gradio_client import Client
          c=Client("numanajmal0/Wan-Video-API",verbose=False)
          print("HEALTH", c.predict(api_name="/health"))
          print("MODELS", c.predict(api_name="/list_models"))
          PY
