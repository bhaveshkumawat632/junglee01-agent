<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Enterprise CRM — junglee01</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 24px; font-weight: 800; color: #fff;
      box-shadow: 0 0 30px rgba(99,102,241,0.4);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .status {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      color: #34d399; font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 999px; margin-bottom: 20px;
      text-transform: uppercase; letter-spacing: 0.1em;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .btn {
      display: block; width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border: none; border-radius: 14px;
      color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(59,130,246,0.3);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 30px rgba(59,130,246,0.5); }
    .info { font-size: 11px; color: #475569; margin-top: 16px; }
    .spinner { display: none; margin: 16px auto; width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CRM</div>
    <div class="status"><span class="dot"></span> System Online</div>
    <h1>Enterprise CRM</h1>
    <p>Mumbai Corporate IT Service Management<br>Field Dispatch • Procurement • Ticketing</p>
    <a id="launch-btn" class="btn" href="#" onclick="launchCRM()">Launch CRM Dashboard →</a>
    <div id="spinner" class="spinner"></div>
    <p class="info">Powered by junglee01 Infrastructure</p>
  </div>

  <script>
    // Tunnel URL - updated dynamically
    const TUNNEL_URL = 'https://parade-gas-though-underlying.trycloudflare.com';

    function launchCRM() {
      document.getElementById('spinner').classList.add('active');
      document.getElementById('launch-btn').style.opacity = '0.6';
      document.getElementById('launch-btn').textContent = 'Connecting...';
      
      // Quick health check then redirect
      fetch(TUNNEL_URL + '/api/ping', { mode: 'no-cors' })
        .then(() => { window.location.href = TUNNEL_URL; })
        .catch(() => { window.location.href = TUNNEL_URL; });
    }

    // Auto-redirect after 1.5s for returning users
    if (window.location.hash === '#auto') {
      setTimeout(launchCRM, 500);
    }
  </script>
</body>
</html>
